name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.${{ github.run_number }}
    secrets: inherit
