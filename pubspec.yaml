name: padpilot
description: "PadPilot: map game controllers to keyboard and mouse on macOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  intl: any
  path_provider: ^2.1.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  config:
    # CocoaPods builds reliably; the Flutter SPM integration did not.
    enable-swift-package-manager: false
  assets:
    - assets/controllers/
    - assets/tray/
    - assets/images/
